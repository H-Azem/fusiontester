# Two services and one public port, all Laravel behind the dashboard.
#
#   internet -> nginx (TLS, your subdomain) -> web:1999 -> api:4000 (internal)
#
# The api image also runs the test pipeline, which is why it carries Flutter, a
# JDK, Maestro, Chromium — and Node, kept only for the browser-driven stages in
# apps/runner. Node is no longer the backend.
#
# Create a .env file next to this compose file:
#   APP_KEY=<php artisan key:generate --show>
#   WEB_ORIGIN=https://tester.example.com
#   ADMIN_PASSWORD=<change me>
#   GIT_HOST / GIT_TOKEN   (only if your apps pull private `git:` pub packages)
#
#   docker compose up -d --build

services:
  api:
    build:
      context: .
      dockerfile: apps/api-laravel/Dockerfile
    restart: unless-stopped
    # init reaps the git/Flutter/Chromium children a run spawns, so a killed
    # container cannot leave a build running.
    init: true
    environment:
      # Encrypts the stored GitLab and AI tokens. Losing it makes them unreadable.
      APP_KEY: ${APP_KEY:?set APP_KEY in .env}
      APP_URL: ${WEB_ORIGIN:?set WEB_ORIGIN in .env}
      # Must match the public URL exactly: login origin checks compare against it.
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in .env}
      TRUST_PROXY: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-fusion}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      CHROME_PATH: /usr/bin/chromium
      # Private `git:` pub packages are authenticated with the token stored in
      # Settings (Settings → GitLab), so the pipeline carries no second copy here.
      # ---- device lane -------------------------------------------------------
      # The Android SDK stays on the host (it is several gigabytes) and is mounted
      # below; adb is referenced by path because the image's PATH is its own.
      ANDROID_HOME: /root/android-sdk
      ANDROID_SDK_ROOT: /root/android-sdk
      FUSION_ADB: /root/android-sdk/platform-tools/adb
      # The redroid container publishes adb on the bridge gateway, so the worker
      # reaches it the same way it reaches any other service.
      FUSION_ANDROID_DEVICE: ${ANDROID_DEVICE:-172.17.0.1:5555}
    volumes:
      # The SQLite database, so a redeploy never loses runs or credentials.
      - api-data:/data
      # Cloned repositories, web builds and screenshots — the large, disposable half.
      - run-workspaces:/app/apps/api-laravel/storage/app/fusion
      # Cached outside the container so Maestro's Chromium and Dart packages are
      # downloaded once rather than on every recreate.
      - maestro-home:/root/.maestro
      - pub-cache:/root/.pub-cache
      # adb, platforms, build-tools and the NDK the APK build needs.
      - ${ANDROID_SDK_PATH:-/root/android-sdk}:/root/android-sdk
      # The pipeline leaves "pause"/"resume" flags here for the host watcher that
      # stops the device for a build; the container itself gets no Docker socket.
      - ${FUSION_CONTROL_PATH:-/srv/fusion-control}:/control
    # apps/api-laravel/docker/supervisord.conf is a conf.d fragment, so supervisor
    # is started from the main config that includes it. -n keeps it in the
    # foreground: the distribution config daemonises by default, which would make
    # the container's main process exit and restart forever.
    command: ["supervisord", "-n", "-c", "/etc/supervisor/supervisord.conf"]
    # Chromium needs more shared memory than the 64MB default.
    shm_size: "1gb"
    # A web build measured ~0.9GB peak and one run happens at a time, so 3g is
    # ample. The limit is deliberately below the whole host: on a 6GB server a
    # container capped at 6g can still take the machine down.
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
    # The dashboard is a thin Next.js server; it needs very little.
    mem_limit: 1g
    ports:
      # Host port is configurable because this is often a shared machine where
      # 1999 is already taken by something else.
      - "127.0.0.1:${WEB_PORT:-1999}:1999"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
  run-workspaces:
  maestro-home:
  pub-cache:
