; Two programs: the HTTP service and the queue worker that executes runs in order.
; The worker is separate so a long build never blocks a request, and supervisor
; restarts it. One worker process keeps the pipeline single-flight, which the
; Flutter build's memory use requires.
[program:web]
command=php artisan serve --host=0.0.0.0 --port=4000
directory=/app/apps/api-laravel
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=php artisan queue:work --tries=1 --timeout=3600 --sleep=2
directory=/app/apps/api-laravel
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
